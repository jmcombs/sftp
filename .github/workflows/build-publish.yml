name: Build and Publish to Docker

on:
  schedule:
    - cron: "0 12 * * *"
  push:
    paths-ignore:
      - "*.md"
      - "*.txt"
      - "*.png"
    branches:
      - "master"
  pull_request:
    branches:
      - "master"
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # for shunit2

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: tests/shunit2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Debian Image for Testing
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          tags: |
            ${{ github.repository }}:debian

      - name: Test Debian Image
        run: tests/run ${{ github.repository }}:debian

      - name: Build Alpine Image for Testing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-alpine
          pull: true
          load: true
          tags: |
            ${{ github.repository }}:alpine

      - name: Test Alpine Image
        run: tests/run ${{ github.repository }}:alpine

      - name: Decide whether to publish
        id: publish
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
        run: |
          set -euo pipefail

          want_publish=false
          if [ "${{ github.event_name }}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            want_publish=true
          fi

          username="${DOCKERHUB_USERNAME:-${DOCKER_USERNAME:-${DOCKER_HUB_USERNAME:-}}}"
          token="${DOCKERHUB_TOKEN:-${DOCKER_TOKEN:-${DOCKER_HUB_PASSWORD:-}}}"

          if [ "$want_publish" = true ] && { [ -z "$username" ] || [ -z "$token" ]; }; then
            echo "::error::Docker Hub credentials are missing. Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (aliases: DOCKER_USERNAME/DOCKER_TOKEN or DOCKER_HUB_USERNAME/DOCKER_HUB_PASSWORD)."
            exit 1
          fi

          echo "publish=$want_publish" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: steps.publish.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_HUB_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: steps.publish.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Debian
        if: steps.publish.outputs.publish == 'true'
        id: meta-debian
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=debian

      - name: Build & Push Debian Image
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          sbom: true
          push: true
          tags: ${{ steps.meta-debian.outputs.tags }}
          labels: ${{ steps.meta-debian.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Extract metadata for Alpine
        if: steps.publish.outputs.publish == 'true'
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ github.repository }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=alpine

      - name: Build & Push Alpine Image
        if: steps.publish.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile-alpine
          pull: true
          sbom: true
          push: true
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm/v7

      - name: Update README on Docker Hub
        if: steps.publish.outputs.publish == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME || secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_HUB_PASSWORD }}
          repository: ${{ github.repository }}
